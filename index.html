<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LHR</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #151920; --line: #242a33;
    --text: #e8eaed; --muted: #8b93a1; --gold: #e3b341; --user: #1f2a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 760px; padding: 18px 16px 10px;
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 26px; letter-spacing: 3px; color: var(--gold); }
  header span { color: var(--muted); font-size: 14px; }
  #chat {
    flex: 1; width: 100%; max-width: 760px; overflow-y: auto;
    padding: 8px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 88%; padding: 12px 14px; border-radius: 14px;
    line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .bot { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; }
  .me { background: var(--user); align-self: flex-end; }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; width: 100%; max-width: 760px; }
  .chips button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { color: var(--gold); border-color: var(--gold); }
  form {
    width: 100%; max-width: 760px; display: flex; gap: 8px; padding: 8px 16px 18px;
  }
  textarea {
    flex: 1; min-width: 0; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    font: inherit; font-size: 16px; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  #send {
    background: var(--gold); color: #1a1405; border: 0; border-radius: 12px;
    padding: 0 20px; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>LHR</h1>
  <span>Ton coach business &amp; argent</span>
</header>

<div id="chat"></div>

<div class="chips" id="chips">
  <button>Comment trouver une idée de business ?</button>
  <button>Comment faire mes premiers 500 € en freelance ?</button>
  <button>Comment mieux vendre mon produit ?</button>
  <button>Comment gérer mon budget et épargner ?</button>
</div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Pose ta question à LHR…"></textarea>
  <button id="send" type="submit">Envoyer</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const chips = document.getElementById("chips");
const history = [];

let code = "";
try { code = localStorage.getItem("lhr_code") || ""; } catch (e) {}
let awaitingCode = false;
let pending = null;

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

addMsg("Salut, moi c'est LHR. Business, vente, argent : dis-moi où tu en es et ce que tu veux atteindre, on construit un plan concret.", "bot");

async function run(text) {
  history.push({ role: "user", content: text });
  sendBtn.disabled = true;
  const wait = addMsg("LHR réfléchit…", "bot typing");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Access-Code": code },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    wait.remove();
    if (res.status === 401) {
      history.pop();
      awaitingCode = true;
      pending = text;
      addMsg(code ? "Code incorrect. Écris le bon code d'accès." : "Code d'accès requis. Écris-le ici.", "bot");
    } else if (data.reply) {
      history.push({ role: "assistant", content: data.reply });
      addMsg(data.reply, "bot");
    } else {
      history.pop();
      addMsg(data.error || "Erreur inconnue.", "bot");
    }
  } catch (e) {
    wait.remove();
    history.pop();
    addMsg("Impossible de joindre le serveur. Réessaie dans un instant.", "bot");
  }
  sendBtn.disabled = false;
  input.focus();
}

async function ask(text) {
  text = text.trim();
  if (!text || sendBtn.disabled) return;
  input.value = "";
  if (awaitingCode) {
    code = text;
    awaitingCode = false;
    try { localStorage.setItem("lhr_code", code); } catch (e) {}
    addMsg("••••••", "me");
    const p = pending;
    pending = null;
    return run(p);
  }
  chips.style.display = "none";
  addMsg(text, "me");
  return run(text);
}

form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
chips.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => ask(b.textContent))
);
</script>
</body>
</html>
